# Entries for /config/secrets.yaml (do NOT commit your real secrets.yaml).
#
# Solcast hobbyist rooftop site: https://toolkit.solcast.com.au → your site →
# the site id looks like xxxx-xxxx-xxxx-xxxx. hours=48 keeps the raw attribute
# below the recorder's 16 kB limit.
solcast_forecast_url: https://api.solcast.com.au/rooftop_sites/YOUR-SITE-ID/forecasts?format=json&hours=48

# Full header value including "Bearer ".
solcast_api_key: Bearer YOUR-SOLCAST-API-KEY
